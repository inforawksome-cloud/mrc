<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Modul - Mediterania Regency Cikunir</title>
<meta name="theme-color" content="#0F6E56" />
<link rel="manifest" href="./manifest.json" />
<link rel="icon" href="./icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#F3F7F5; --card:#FFFFFF; --teal-900:#04342C; --teal-800:#085041; --teal-600:#0F6E56;
  --teal-400:#1D9E75; --teal-50:#E1F5EE; --coral-600:#993C1D; --amber-700:#9A5B0E; --amber-100:#FDEBD3;
  --text-1:#182420; --text-2:#5B6E68; --text-muted:#93A29D; --border:#DCE7E3;
  font-family:"Plus Jakarta Sans", -apple-system, sans-serif;
}
*{box-sizing:border-box;}
body{margin:0; background:var(--bg); color:var(--text-1); padding-bottom:calc(env(safe-area-inset-bottom) + 90px);}
header{
  padding:calc(env(safe-area-inset-top) + 16px) 20px 14px; display:flex; align-items:center; gap:12px;
  background:var(--teal-600); color:#fff; position:sticky; top:0; z-index:20;
}
header h1{font-size:16px; font-weight:700; margin:0;}
header p{font-size:12px; margin:2px 0 0; color:rgba(255,255,255,0.8);}
.icon-btn{width:36px; height:36px; border-radius:10px; border:none; background:rgba(255,255,255,0.18); color:#fff; font-size:16px; flex-shrink:0;}
.ikon-putar{display:inline-block; line-height:1;}
.icon-btn.spin .ikon-putar{animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
main{padding:16px 20px 8px; max-width:760px; margin:0 auto;}
.card{background:var(--card); border:1px solid var(--border); border-radius:16px; padding:14px 16px; margin-bottom:12px;}
.card h2{font-size:14px; margin:0 0 10px;}
.masuk-info{font-size:13px; color:var(--text-2); display:flex; justify-content:space-between; align-items:center; gap:10px;}
.masuk-info b{color:var(--text-1);}
label{display:block; font-size:12px; font-weight:600; color:var(--text-2); margin:10px 0 4px;}
input, select, textarea{
  width:100%; border:1px solid var(--border); border-radius:12px; padding:10px 12px;
  font-family:inherit; font-size:16px; color:var(--text-1); background:#fff;
}
.baris2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.btn{
  width:100%; border:none; border-radius:12px; padding:12px; margin-top:12px; background:var(--teal-600);
  color:#fff; font-family:inherit; font-size:14px; font-weight:600;
}
.btn.kecil{width:auto; padding:8px 14px; margin-top:0; font-size:12.5px;}
.btn.abu{background:#E6EEEB; color:var(--text-1);}
.btn:disabled{opacity:0.5;}
.item{background:var(--card); border:1px solid var(--border); border-radius:14px; padding:14px 16px; margin-bottom:10px;}
.item .judul{font-size:14.5px; font-weight:700; margin:0 0 4px;}
.item .detail{font-size:13px; color:var(--text-2); margin:3px 0; line-height:1.45; white-space:pre-wrap;}
.item .meta{font-size:11.5px; color:var(--text-muted); margin-top:8px;}
.badge{display:inline-block; font-size:11px; font-weight:700; padding:2px 8px; border-radius:8px; background:var(--teal-50); color:var(--teal-800); margin-left:6px; vertical-align:middle;}
.badge.akhir{background:#ECEFEE; color:var(--text-muted);}
.aksi-baris{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;}
.aksi-baris a{font-size:12.5px; font-weight:600; color:var(--teal-600); text-decoration:none; padding:8px 14px; border:1px solid var(--border); border-radius:10px;}
.kosong{text-align:center; color:var(--text-muted); font-size:13px; padding:24px 0;}
.toast{
  position:fixed; left:20px; right:20px; bottom:24px; background:var(--teal-600); color:#fff; padding:14px 18px;
  border-radius:14px; font-size:13.5px; font-weight:600; text-align:center; box-shadow:0 8px 24px rgba(0,0,0,0.18);
  opacity:0; transform:translateY(12px); transition:opacity 0.25s, transform 0.25s; pointer-events:none;
}
.toast.show{opacity:1; transform:translateY(0);}
.toast.err{background:var(--coral-600);}
.foto{width:100%; height:220px; object-fit:contain; border-radius:12px; margin:0 0 10px; background:#E6EEEB; display:block;}
.foto-pilih{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}
.foto-pilih input{flex:1; min-width:180px;}
.foto-pilih img{width:84px; height:84px; object-fit:cover; border-radius:10px; border:1px solid var(--border);}
.hint{font-size:11.5px; color:var(--text-muted); margin:6px 0 0; line-height:1.4;}
label{line-height:1.35;}
input[type=date], input[type=time], input[type=number]{
  -webkit-appearance:none; appearance:none; display:block; width:100%; min-width:0; max-width:100%;
  min-height:46px; line-height:1.25; background-color:#fff;
}
input[type=date]::-webkit-date-and-time-value, input[type=time]::-webkit-date-and-time-value{ text-align:left; min-height:1.25em; margin:0; }
input[type=date]::-webkit-datetime-edit, input[type=time]::-webkit-datetime-edit{ padding:0; }
.foto-thumb{float:left; width:88px; height:88px; object-fit:cover; border-radius:12px; margin:0 12px 8px 0; background:#E6EEEB;}
.item::after{content:""; display:table; clear:both;}
.aksi-baris{clear:both;}
body.embed .aksi-baris .btn{padding:12px 22px; font-size:15px; min-height:46px;}
a.btn{display:inline-block; text-decoration:none; text-align:center;}
.aksi-baris a.btn{color:#fff; border:none;}
.catatan-pinjam{background:#E1F5EE; color:#085041; border-radius:12px; padding:10px 12px; margin:0 0 10px; font-size:13px; line-height:1.4;}
.catatan-pinjam a{color:#0F6E56; font-weight:600;}
</style>
</head>
<body>
<header>
  <button class="icon-btn" id="btn-kembali" aria-label="Kembali">&#8592;</button>
  <div style="flex:1">
    <h1 id="judul">Memuat...</h1>
    <p id="subjudul"></p>
  </div>
  <button class="icon-btn" id="btn-muat" aria-label="Muat ulang"><span class="ikon-putar">&#8635;</span></button>
</header>
<main>
  <div class="card" id="kotak-masuk"></div>
  <div class="card" id="form-tambah" style="display:none;"></div>
  <input type="search" id="cari" placeholder="Cari..." style="display:none; margin-bottom:10px;" />
  <div id="daftar"><p class="kosong">Memuat...</p></div>
</main>
<div class="toast" id="toast"></div>

<script src="./config.js"></script>
<script>
var KODE = new URLSearchParams(location.search).get("m") || "";
var skema = null;
var sesi = null;
try { sesi = JSON.parse(sessionStorage.getItem("sesi") || "null"); } catch (e) { sesi = null; }
// Mode tertanam (dipakai Portal Satpam): tanpa header dan tanpa PIN (akses cepat di pos jaga)
var EMBED = new URLSearchParams(location.search).get("embed") === "1";
if (EMBED) {
  document.querySelector("header").style.display = "none";
  document.body.classList.add("embed");
  sesi = { kav: "SATPAM", pin: "", peran: "satpam" };
  try { localStorage.removeItem("sesiSatpam"); } catch (e) {}
}
var demo = !CONFIG.API_URL || CONFIG.API_URL.indexOf("PASTE_URL") !== -1;

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function toast(msg, err) {
  var t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "toast show" + (err ? " err" : "");
  setTimeout(function () { t.className = "toast"; }, 2800);
}
function api(body) {
  return fetch(CONFIG.API_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(EMBED ? Object.assign({ portal: "satpam" }, body) : body)
  }).then(function (r) { return r.json(); });
}

function gambarMasuk() {
  var el = document.getElementById("kotak-masuk");
  if (EMBED) { el.style.display = "none"; return; }
  if (sesi) {
    el.innerHTML = '<div class="masuk-info"><span>Masuk sebagai <b>' + esc(sesi.kav) + '</b> (' + esc(sesi.peran) + ')</span><button class="btn kecil abu" id="btn-keluar">Keluar</button></div>';
    document.getElementById("btn-keluar").onclick = function () {
      sessionStorage.removeItem("sesi"); localStorage.removeItem("sesiSatpam"); sesi = null; gambarMasuk(); muat();
    };
    return;
  }
  el.innerHTML = '<h2>Masuk dengan Kav dan PIN</h2><div class="baris2"><div><label>Kav</label><input type="text" id="in-kav" placeholder="contoh: A1" autocapitalize="characters" autocomplete="off" /></div><div><label>PIN</label><input type="password" id="in-pin" inputmode="numeric" placeholder="PIN" autocomplete="new-password" /></div></div><button class="btn" id="btn-masuk">Masuk</button>';
  if (EMBED) document.getElementById("in-kav").value = "SATPAM";
  document.getElementById("btn-masuk").onclick = function () {
    var kav = document.getElementById("in-kav").value.trim();
    var pin = document.getElementById("in-pin").value.trim();
    if (!kav || !pin) { toast("Isi Kav dan PIN", true); return; }
    if (demo) { toast("Mode demo", true); return; }
    var b = document.getElementById("btn-masuk"); b.disabled = true;
    api({ type: "modul", modul: KODE, aksi: "masuk", kav: kav, pin: pin }).then(function (d) {
      if (d.success) {
        sesi = { kav: d.kav, pin: pin, peran: d.peran };
        sessionStorage.setItem("sesi", JSON.stringify(sesi));
        if (EMBED && (d.peran === "satpam" || d.peran === "admin")) localStorage.setItem("sesiSatpam", JSON.stringify(sesi));
        toast("Berhasil masuk");
        gambarMasuk(); muat();
      } else { toast(d.error || "Gagal masuk", true); b.disabled = false; }
    }).catch(function () { toast("Gagal terhubung", true); b.disabled = false; });
  };
}

function bolehTulis() {
  return skema.tulis === "warga" || sesi.peran === "admin" || skema.tulis === sesi.peran;
}

function hariIni() {
  var d = new Date(), m = d.getMonth() + 1, t = d.getDate();
  return d.getFullYear() + "-" + (m < 10 ? "0" : "") + m + "-" + (t < 10 ? "0" : "") + t;
}

function gambarForm() {
  var el = document.getElementById("form-tambah");
  if (!sesi || !skema || !bolehTulis()) { el.style.display = "none"; return; }
  var h = "<h2>Tambah data</h2>";
  skema.kolom.forEach(function (c) {
    if (c.tipe === "sistem") return;
    h += "<label>" + esc(c.label) + (c.wajib ? " *" : "") + "</label>";
    if (c.tipe === "foto") {
      h += '<div class="foto-pilih"><input type="file" accept="image/*" data-foto="' + esc(c.k) + '" /><img id="pratinjau-' + esc(c.k) + '" style="display:none;" alt="" /></div><p class="hint">' + esc(c.petunjuk || "Foto barang saja, jangan foto orang atau dokumen. Foto dihapus otomatis saat barang selesai atau kedaluwarsa.") + "</p>";
    } else if (c.tipe === "area") {
      h += '<textarea data-k="' + esc(c.k) + '" rows="3" maxlength="500"></textarea>';
    } else if (c.tipe === "aset") {
      h += '<select data-k="' + esc(c.k) + '"><option value="">Pilih aset...</option>' + (c.opsi || []).map(function (o) { return '<option value="' + esc(o.v) + '">' + esc(o.l) + "</option>"; }).join("") + "</select>";
    } else if (c.tipe === "pilihan") {
      h += '<select data-k="' + esc(c.k) + '"><option value="">Pilih...</option>' +
        c.opsi.map(function (o) { return "<option>" + esc(o) + "</option>"; }).join("") + "</select>";
    } else {
      var jt = c.tipe === "tanggal" ? "date" : c.tipe === "jam" ? "time" : c.tipe === "angka" ? "number" : "text";
      h += '<input type="' + jt + '" data-k="' + esc(c.k) + '"' + (jt === "text" ? ' maxlength="500"' : "") + (jt === "number" ? ' min="0" inputmode="numeric"' : "") + (jt === "date" && c.tidakLampau ? ' min="' + hariIni() + '"' : "") + " />";
    }
  });
  h += '<button class="btn" id="btn-kirim">Kirim</button>';
  el.innerHTML = h;
  el.style.display = "block";
  document.getElementById("btn-kirim").onclick = kirim;
  fotoTerpilih = {};
  document.querySelectorAll("#form-tambah input[data-foto]").forEach(function (inp) {
    inp.onchange = function () {
      var k = inp.getAttribute("data-foto");
      var f = inp.files && inp.files[0];
      delete fotoTerpilih[k]; thumbTerpilih = "";
      var pr = document.getElementById("pratinjau-" + k);
      if (!f) { pr.style.display = "none"; return; }
      if (f.type && f.type.indexOf("image/") !== 0) { toast("Pilih berkas gambar", true); inp.value = ""; return; }
      kompres(f, 1000).then(function (d) { fotoTerpilih[k] = d; pr.src = d; pr.style.display = "block"; return kecilkan(d, 110).then(function (th) { thumbTerpilih = th; }); })
        .catch(function () { toast("Foto tidak bisa dibaca", true); inp.value = ""; });
    };
  });
}

var fotoTerpilih = {};
var thumbTerpilih = "";

function hariIni() {
  var d = new Date();
  return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2);
}

// Catatan di atas daftar Inventaris Aset: cara meminjam
function catatanAset() {
  if (KODE !== "aset") return "";
  if (!sesi) return '<div class="catatan-pinjam">Masuk dengan Kav dan PIN (kotak di atas) untuk meminjam aset.</div>';
  return '<div class="catatan-pinjam">Tekan <b>Pinjam</b> pada aset yang dibutuhkan. <a href="modul.html?m=pinjamaset">Lihat pinjaman saya</a></div>';
}

// Formulir Peminjaman Aset: isi awal aset (dari tombol Pinjam), tanggal ambil hari ini, jumlah 1
function isiAwalPinjam() {
  if (KODE !== "pinjamaset") return;
  var f = document.getElementById("form-tambah");
  if (!f || f.style.display === "none") return;
  var sel = f.querySelector('[data-k="aset_id"]'), tA = f.querySelector('[data-k="tgl_ambil"]'), jm = f.querySelector('[data-k="jumlah"]');
  var pre = new URLSearchParams(location.search).get("aset");
  if (sel && pre && !sel.value) sel.value = pre;
  if (tA && !tA.value) tA.value = hariIni();
  if (jm && !jm.value) jm.value = "1";
}
var gambarFormAsli = gambarForm;
gambarForm = function () { gambarFormAsli(); isiAwalPinjam(); };

// Foto kecil (sisi terpanjang 110 px, ~3-6 KB) untuk daftar Portal Satpam
function kecilkan(dataUrl, maks) {
  return new Promise(function (resolve) {
    var img = new Image();
    img.onload = function () {
      var s = Math.min(1, maks / Math.max(img.width, img.height));
      var c = document.createElement("canvas");
      c.width = Math.max(1, Math.round(img.width * s));
      c.height = Math.max(1, Math.round(img.height * s));
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      var q = 0.55, d = c.toDataURL("image/jpeg", q);
      while (d.length > 9000 && q > 0.25) { q -= 0.1; d = c.toDataURL("image/jpeg", q); }
      resolve(d.length <= 12000 ? d : "");
    };
    img.onerror = function () { resolve(""); };
    img.src = dataUrl;
  });
}

function kompres(file, maks) {
  return new Promise(function (resolve, reject) {
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function () {
      var s = Math.min(1, maks / Math.max(img.width, img.height));
      var c = document.createElement("canvas");
      c.width = Math.round(img.width * s);
      c.height = Math.round(img.height * s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      var q = 0.8, d = c.toDataURL("image/jpeg", q);
      while (d.length > 900000 && q > 0.3) { q -= 0.15; d = c.toDataURL("image/jpeg", q); }
      resolve(d);
    };
    img.onerror = function () { URL.revokeObjectURL(url); reject(new Error("gagal membaca gambar")); };
    img.src = url;
  });
}

function kirim() {
  var data = {};
  document.querySelectorAll("#form-tambah [data-k]").forEach(function (f) { data[f.getAttribute("data-k")] = f.value; });
  Object.keys(fotoTerpilih).forEach(function (k) { data[k] = fotoTerpilih[k]; });
  if (skema.thumb && thumbTerpilih && Object.keys(fotoTerpilih).length) data.thumb = thumbTerpilih;
  var b = document.getElementById("btn-kirim"); b.disabled = true; b.textContent = "Mengirim...";
  api({ type: "modul", modul: KODE, aksi: "tambah", kav: sesi.kav, pin: sesi.pin, data: data }).then(function (d) {
    if (d.success) { toast("Tersimpan"); muat(); }
    else { toast(d.error || "Gagal menyimpan", true); b.disabled = false; b.textContent = "Kirim"; }
  }).catch(function () { toast("Gagal terhubung", true); b.disabled = false; b.textContent = "Kirim"; });
}

function linkWa(v) {
  var no = String(v).replace(/[^0-9]/g, "");
  if (no.length < 9) return "";
  var wa = no.charAt(0) === "0" ? "62" + no.slice(1) : no;
  return '<div class="aksi-baris"><a href="https://wa.me/' + wa + '" target="_blank" rel="noopener">Hubungi via WhatsApp</a></div>';
}

function tombolAksi(r) {
  if (!sesi) return "";
  var h = "";
  (skema.aksi || []).forEach(function (a) {
    if (a.dari.indexOf(String(r.Status)) === -1) return;
    var boleh = sesi.peran === "admin" || a.peran === "warga" || a.peran === sesi.peran || (a.peran === "pemilik" && String(r.Kav).toUpperCase() === sesi.kav);
    if (boleh) h += '<button class="btn kecil" data-aksi="' + esc(a.nama) + '" data-id="' + esc(r.ID) + '">' + esc(a.label) + "</button>";
  });
  if ((sesi.peran === "admin" || String(r.Kav).toUpperCase() === sesi.kav) && (!skema.bolehHapusDari || sesi.peran === "admin" || skema.bolehHapusDari.indexOf(String(r.Status)) >= 0)) {
    h += '<button class="btn kecil abu" data-aksi="Dihapus" data-id="' + esc(r.ID) + '">Hapus</button>';
  }
  return h ? '<div class="aksi-baris">' + h + "</div>" : "";
}

function gambarDaftar(baris) {
  var el = document.getElementById("daftar");
  document.getElementById("cari").style.display = (baris && baris.length > 3) ? "block" : "none";
  if (!baris || !baris.length) { el.innerHTML = '<p class="kosong">Belum ada data.</p>'; return; }
  var akhir = skema.statusAkhir;
  el.innerHTML = catatanAset() + baris.map(function (r) {
    var judul = esc(r[skema.kolom[0].k]);
    var foto = "";
    var kf = skema.kolom.filter(function (c) { return c.tipe === "foto"; })[0];
    if (kf && /^[A-Za-z0-9_-]{10,}$/.test(String(r[kf.k] || ""))) {
      var fid = String(r[kf.k]);
      foto = '<a href="https://drive.google.com/thumbnail?id=' + fid + '&amp;sz=w1600" target="_blank" rel="noopener"><img class="foto" loading="lazy" alt="" src="https://drive.google.com/thumbnail?id=' + fid + '&amp;sz=w600" onerror="this.parentNode.style.display=&#39;none&#39;" /></a>';
    }
    if (!foto && r.thumb && /^data:image\/jpeg;base64,[A-Za-z0-9+\/=]+$/.test(String(r.thumb))) {
      foto = '<img class="foto-thumb" alt="Foto tamu" src="' + r.thumb + '">';
    }
    var detail = "", wa = "";
    skema.kolom.slice(1).forEach(function (c) {
      var v = r[c.k];
      if (v === "" || v == null) return;
      if (c.tipe === "foto" || c.tipe === "aset") return;
      if (c.k === "kontak") { wa = linkWa(v); return; }
      detail += '<div class="detail">' + esc(c.label) + ": " + esc(v) + "</div>";
    });
    var selesai = (akhir && String(r.Status) === akhir) || String(r.Status) === "Kedaluwarsa" || !!(skema.statusSelesai && skema.statusSelesai.indexOf(String(r.Status)) >= 0);
    var bisaUbah = sesi && akhir && !selesai && (sesi.peran === "admin" || String(r.Kav).toUpperCase() === sesi.kav);
    var tombol = bisaUbah ? '<div class="aksi-baris"><button class="btn kecil" data-selesai="' + esc(r.ID) + '">Tandai ' + esc(akhir.toLowerCase()) + "</button></div>" : "";
    if (skema.aksi) tombol = tombolAksi(r);
    if (KODE === "aset") {
      detail += '<div class="detail">Tersedia: ' + esc(r.tersedia) + " dari " + esc(r.jumlah) + (Number(r.dipinjam) ? " (sedang dipinjam " + esc(r.dipinjam) + ")" : "") + "</div>";
      if (sesi) {
        var pinjam = Number(r.tersedia) > 0 ? '<a class="btn kecil" href="modul.html?m=pinjamaset&aset=' + encodeURIComponent(r.ID) + '">Pinjam</a>' : '<span class="btn kecil abu" style="opacity:0.6">Habis</span>';
        tombol = tombol ? tombol.replace('<div class="aksi-baris">', '<div class="aksi-baris">' + pinjam) : '<div class="aksi-baris">' + pinjam + "</div>";
      }
    }
    var telat = "";
    if (KODE === "pinjamaset" && String(r.Status) === "Dipinjam" && String(r.tgl_kembali || "") && String(r.tgl_kembali) < hariIni()) {
      telat = ' <span class="badge" style="background:#FDE8E8;color:#9B1C1C">Lewat tempo</span>';
    }
    return '<div class="item">' + foto + '<p class="judul">' + judul + '<span class="badge' + (selesai ? " akhir" : "") + '">' + esc(r.Status) + "</span>" + telat + "</p>" +
      detail + (selesai ? "" : wa) + '<div class="meta">' + (skema.sembunyikanKav ? "Dicatat " : "Kav " + esc(r.Kav) + " &middot; ") + esc(r.Waktu) + "</div>" + ((selesai && !skema.aksi) ? "" : tombol) + "</div>";
  }).join("");
}

document.getElementById("daftar").addEventListener("click", function (e) {
  var b = e.target.closest("[data-selesai], [data-aksi]");
  if (!b || !sesi) return;
  var statusBaru = b.hasAttribute("data-aksi") ? b.getAttribute("data-aksi") : skema.statusAkhir;
  var idBaris = b.getAttribute("data-id") || b.getAttribute("data-selesai");
  if (statusBaru === "Dihapus" && !confirm("Hapus data ini?")) return;
  b.disabled = true;
  api({ type: "modul", modul: KODE, aksi: "status", kav: sesi.kav, pin: sesi.pin, id: idBaris, status: statusBaru }).then(function (d) {
    if (d.success) { toast("Diperbarui"); muat(); }
    else { toast(d.error || "Gagal memperbarui", true); b.disabled = false; }
  }).catch(function () { toast("Gagal terhubung", true); b.disabled = false; });
});

function gambarHeader() {
  document.getElementById("judul").textContent = (skema.ikon ? skema.ikon + " " : "") + skema.judul;
  document.getElementById("subjudul").textContent = CONFIG.NAMA_KOMPLEK || "";
  document.title = skema.judul + " - " + (CONFIG.NAMA_KOMPLEK || "");
}

function muat() {
  var daftar = document.getElementById("daftar");
  var tombol = document.getElementById("btn-muat");
  if (demo || !KODE) { daftar.innerHTML = '<p class="kosong">Mode demo atau modul belum dipilih.</p>'; return; }
  tombol.classList.add("spin");
  if (daftar.querySelector(".kosong")) daftar.innerHTML = '<p class="kosong">Memuat...</p>';
  var p;
  if (skema && skema.baca !== "publik") {
    if (!sesi) { daftar.innerHTML = '<p class="kosong">Masuk dulu untuk melihat data.</p>'; tombol.classList.remove("spin"); return; }
    p = api({ type: "modul", modul: KODE, aksi: "baca", kav: sesi.kav, pin: sesi.pin });
  } else {
    p = fetch(CONFIG.API_URL + "?aksi=modul&m=" + encodeURIComponent(KODE), { cache: "no-store" }).then(function (r) { return r.json(); });
  }
  p.then(function (d) {
    if (d.skema) { skema = d.skema; gambarHeader(); }
    if (d.perluLogin) { if (sesi) { muat(); return; } gambarForm(); daftar.innerHTML = '<p class="kosong">Masuk dulu untuk melihat data.</p>'; return; }
    if (!d.success) { daftar.innerHTML = '<p class="kosong">' + esc(d.error || "Gagal memuat") + "</p>"; return; }
    gambarForm();
    gambarDaftar(d.baris);
  }).catch(function () {
    daftar.innerHTML = '<p class="kosong">Gagal terhubung ke server.</p>';
  }).then(function () { tombol.classList.remove("spin"); });
}

document.getElementById("cari").oninput = function () {
  var q = this.value.toLowerCase();
  document.querySelectorAll("#daftar .item").forEach(function (it) { it.style.display = it.textContent.toLowerCase().indexOf(q) >= 0 ? "" : "none"; });
};

document.getElementById("btn-kembali").onclick = function () { location.href = "./index.html"; };
document.getElementById("btn-muat").onclick = muat;
gambarMasuk();
muat();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("./sw.js", { updateViaCache: "none" }).then(function (reg) { reg.update(); });
  });
}
</script>
</body>
</html>
